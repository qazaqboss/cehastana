<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f0efeb;color:#1b1d1f;font-family:Inter;position:relative;overflow:hidden}
.clip{position:absolute;inset:25px;overflow:hidden}.img{position:absolute;right:0;top:0;height:100%;width:auto;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
.frame{position:absolute;inset:24px;border:1.5px solid #1b1d1f;pointer-events:none}
.txt{position:absolute;left:64px;top:64px;width:560px;z-index:2}.price,.stamp{z-index:2}
.eb{font:500 15px "JetBrains Mono";letter-spacing:.1em;text-transform:uppercase;color:#62666a}
h1{font:700 104px/0.92 "Inter Tight";letter-spacing:-.03em;margin-top:26px}
h1 em{font-style:normal;color:#c8243a;display:block}
.sub{font:500 27px/1.3 Inter;margin-top:22px;color:#33373b}
.price{position:absolute;left:64px;bottom:64px;display:flex;align-items:flex-end;gap:22px}
.pv{background:#c8243a;color:#fff;padding:16px 22px 14px}
.pv b{font:700 54px/1 "Inter Tight";letter-spacing:-.01em}
.pv span{display:block;font:500 16px Inter;margin-top:4px;opacity:.9}
.facts{font:500 16px/1.6 "JetBrains Mono";color:#33373b;background:#f0efebe6;padding:8px 12px}
.stamp{position:absolute;right:24px;bottom:24px;border-left:1.5px solid #1b1d1f;border-top:1.5px solid #1b1d1f;display:grid;grid-template-columns:auto auto;font:500 13px "JetBrains Mono";background:#fbfbf9}
.stamp div{padding:9px 14px;border-right:1px solid #c9cac4}.stamp div:last-child{border:0}
</style>
